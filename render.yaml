# Render Blueprint: Congress Map
# Repo: https://github.com/Chad-LPL/space2026-q1-colors
# After creating the backend, create a Static Site manually for the frontend (see README "Deploy on Render").

services:
  - type: web
    name: congress-map-api
    runtime: python
    rootDir: backend
    # DB is created at startup (build phase filesystem is read-only on Render).
    # Use paths from repo root: Render may run build/start from /opt/render/project/src (repo root).
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python backend/schema.py && python backend/seed_scripts.py && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CONGRESS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
        optional: true
