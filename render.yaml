# Render Blueprint: Congress Map
# Repo: https://github.com/Chad-LPL/space2026-q1-colors
# After creating the backend, create a Static Site manually for the frontend (see README "Deploy on Render").
#
# Important: Set Root Directory to "backend" in the Render dashboard so build and start
# both run from backend/. That way pip install and Python see the same requirements.txt
# and the same env (no ModuleNotFoundError).

services:
  - type: web
    name: congress-map-api
    runtime: python
    rootDir: backend
    # DB is created at startup (build phase filesystem is read-only on Render).
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python schema.py && python seed_scripts.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CONGRESS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
        optional: true
